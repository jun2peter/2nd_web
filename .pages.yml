media:
  input: media
  output: /media

content:
  - name: site
    label: Site settings
    type: file
    path: content/site.json
    format: json
    fields:
      - { name: name, label: Display name, type: string, required: true }
      - { name: shortName, label: Short mark, type: string }
      - { name: role, label: Role line, type: string }
      - { name: location, label: Location, type: string }
      - { name: email, label: Contact email, type: string }
      - { name: intro, label: Homepage statement, type: text }
      - { name: about, label: About, type: text }
      - { name: availability, label: Archive note, type: string }
      - name: theme
        label: Look and motion
        type: object
        fields:
          - { name: accent, label: Accent colour, type: string }
          - { name: signal, label: Signal colour, type: string }
          - { name: paper, label: Archive background, type: string }
          - { name: ink, label: Archive text, type: string }
          - name: motion
            label: Motion level
            type: select
            options:
              values: [full, gentle, off]
      - name: socials
        label: Social links
        type: object
        list: true
        fields:
          - { name: label, type: string }
          - { name: url, type: string }

  - name: projects
    label: Works
    type: file
    path: content/projects.json
    format: json
    list: true
    fields:
      - { name: slug, label: URL name, type: string, required: true }
      - { name: title, label: English title, type: string, required: true }
      - { name: titleKo, label: Korean title, type: string }
      - { name: year, type: string }
      - name: category
        type: select
        options:
          values: [Robotic Installation, Moving Image, AI Film, Research, Object, Performance]
      - { name: status, type: string }
      - { name: format, type: string }
      - { name: duration, type: string }
      - { name: role, type: text }
      - { name: summary, type: text }
      - { name: statement, type: text }
      - { name: researchQuestion, label: Research question, type: text }
      - { name: methods, type: string, list: true }
      - { name: tools, label: Tools and materials, type: string, list: true }
      - { name: recognition, label: Exhibition / recognition, type: text }
      - { name: cover, label: Cover image, type: image }
      - name: gallery
        type: object
        list: true
        fields:
          - { name: image, type: image }
          - { name: caption, type: string }
      - name: visual
        label: Placeholder visual
        type: object
        fields:
          - { name: accent, type: string }
          - { name: secondary, type: string }
          - name: motif
            type: select
            options:
              values: [eyes, balance, sun]
      - { name: featured, type: boolean }

  - name: archive
    label: Archive Studio 5 · Responsive
    type: file
    path: content/archive.json
    format: json
    fields:
      - { name: version, label: 데이터 버전, type: number, readonly: true }
      - name: settings
        label: 사이트 전체 설정
        type: object
        fields:
          - { name: defaultPageId, label: 홈페이지 ID, type: string }
          - name: homeView
            label: 첫 화면
            type: select
            options:
              values: [experience, archive]
          - name: scaleMode
            label: 화면 맞춤
            type: select
            options:
              values: [fit, max-100]
          - { name: hideViewSwitch, label: 상단 전환 막대 숨김, type: boolean }
          - name: responsive
            label: 반응형 기준 폭
            type: object
            fields:
              - { name: tabletMax, label: 태블릿 배치 (이 폭 이하), type: number }
              - { name: mobileMax, label: 모바일 배치 (이 폭 이하), type: number }
          - name: smoothScroll
            label: 부드러운 스크롤
            type: object
            fields:
              - { name: enabled, label: 사용, type: boolean }
              - { name: intensity, label: 부드러움 (0.02–0.5), type: number }
          - name: transition
            label: 페이지 전환
            type: object
            fields:
              - name: preset
                type: select
                options:
                  values: [none, fade, slide, zoom, wipe, circle, blur]
              - { name: duration, label: 시간(ms), type: number }
              - { name: easing, type: string }
              - { name: color, label: 전환 배경색, type: string }
          - { name: showPageNav, label: 고정 전역 페이지 메뉴, type: boolean }
          - { name: showScrollProgress, label: 스크롤 진행선, type: boolean }
          - { name: showMotionToggle, label: 모션 정지 버튼, type: boolean }
          - name: cursor
            type: select
            options:
              values: [default, dot, crosshair, ring, blend]
          - { name: cursorColor, label: 커서 색, type: string }
          - { name: fonts, label: 구글 폰트 이름, type: string, list: true }
          - { name: customCSS, label: 사이트 CSS, type: code }
          - { name: customHead, label: head 코드, type: code }
          - name: seo
            label: 기본 SEO
            type: object
            fields:
              - { name: titleSuffix, label: 제목 뒤 문구, type: string }
              - { name: description, label: 기본 설명, type: text }
              - { name: image, label: 기본 공유 이미지, type: image }
              - { name: noIndex, label: 전체 검색 숨김, type: boolean }
      - name: pages
        label: 페이지
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name} · /{slug} · {visibility}"
        fields:
          - { name: id, label: 페이지 ID, type: string, required: true }
          - { name: name, label: 페이지 이름, type: string, required: true }
          - { name: slug, label: URL 경로, type: string, required: true }
          - name: visibility
            label: 공개 상태
            type: select
            options:
              values: [listed, unlisted, draft]
          - name: canvas
            label: 아트보드
            type: object
            fields:
              - { name: width, label: 너비, type: number }
              - { name: height, label: 페이지 길이, type: number }
              - { name: background, label: 배경색, type: string }
              - { name: grid, label: 스냅 간격, type: number }
              - { name: fontStylesheet, label: 웹폰트 CSS 주소, type: string }
              - { name: viewport, label: 첫 화면 높이, type: number }
              - { name: backgroundImage, label: 배경 이미지, type: string }
              - { name: backgroundVideo, label: 배경 영상, type: string }
              - name: backgroundFit
                label: 배경 맞춤
                type: select
                options:
                  values: [cover, contain]
              - { name: backgroundPosition, label: 배경 위치, type: string }
              - { name: backgroundOverlay, label: 배경 덮는 색, type: string }
              - name: backgroundEffect
                label: 배경 효과
                type: select
                options:
                  values: [none, drift, noise, drift-noise]
          - { name: customCSS, label: 페이지 CSS, type: code }
          - name: layouts
            label: 태블릿·모바일 배치
            type: object
            fields:
              - name: tablet
                type: object
                fields:
                  - { name: enabled, label: 사용, type: boolean }
                  - { name: width, label: 너비, type: number }
                  - { name: height, label: 페이지 길이, type: number }
                  - { name: viewport, label: 첫 화면 높이, type: number }
              - name: mobile
                type: object
                fields:
                  - { name: enabled, label: 사용, type: boolean }
                  - { name: width, label: 너비, type: number }
                  - { name: height, label: 페이지 길이, type: number }
                  - { name: viewport, label: 첫 화면 높이, type: number }
          - name: seo
            label: 페이지 SEO
            type: object
            fields:
              - { name: title, label: 제목, type: string }
              - { name: description, label: 설명, type: text }
              - { name: image, label: 공유 이미지, type: image }
              - { name: noIndex, label: 검색에서 숨김, type: boolean }
              - { name: language, label: 언어 코드, type: string }
          - name: blocks
            label: 배치 요소
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{name} · {type}"
            fields:
              - { name: id, label: 요소 ID, type: string, required: true }
              - { name: name, label: 레이어 이름, type: string }
              - name: type
                label: 요소 종류
                type: select
                options:
                  values: [text, image, video, audio, button, shape, line, marquee, gallery, embed, nav, component, code]
              - { name: visible, label: 보이기, type: boolean }
              - { name: locked, label: 잠금, type: boolean }
              - { name: anchorId, label: 위치 ID, type: string }
              - { name: x, label: X, type: number }
              - { name: y, label: Y, type: number }
              - { name: width, label: 너비, type: number }
              - { name: height, label: 높이, type: number }
              - { name: z, label: 레이어 순서, type: number }
              - { name: rotation, label: 회전, type: number }
              - { name: opacity, label: 투명도, type: number }
              - { name: content, label: 글자 내용, type: text }
              - { name: src, label: 외부 미디어·임베드 링크, type: string }
              - name: media
                label: 업로드 미디어 파일
                type: file
                options:
                  categories: [image, video, audio, document]
              - { name: backgroundImage, label: 버튼 배경 이미지, type: image }
              - { name: alt, label: 미디어 설명, type: string }
              - { name: poster, label: 영상 포스터, type: image }
              - { name: captions, label: 영상 자막 경로, type: string }
              - name: playbackMode
                label: 영상·오디오 재생 방식
                type: select
                options:
                  values: [autoplay, click, hover, in-view, controls, link]
              - name: gifPlayback
                label: GIF 재생 방식
                type: select
                options:
                  values: [auto, click, hover]
              - name: embedMode
                label: 임베드 사용 방식
                type: select
                options:
                  values: [interactive, click, link]
              - { name: playLabel, label: 재생·링크 버튼 문구, type: string }
              - { name: pauseWhenHidden, label: 화면 밖에서 정지, type: boolean }
              - name: preload
                label: 미디어 미리 불러오기
                type: select
                options:
                  values: [none, metadata, auto]
              - { name: ariaLabel, label: 접근성 이름, type: string }
              - { name: decorative, label: 장식 이미지, type: boolean }
              - name: action
                label: 클릭 동작
                type: object
                fields:
                  - name: type
                    type: select
                    options:
                      values: [none, page, anchor, external, email, phone, download, back]
                  - { name: pageId, label: 이동할 페이지 ID, type: string }
                  - { name: anchorId, label: 위치 ID, type: string }
                  - { name: url, label: 외부·다운로드 URL, type: string }
                  - { name: email, type: string }
                  - { name: subject, label: 메일 제목, type: string }
                  - { name: body, label: 메일 본문, type: text }
                  - { name: phone, label: 전화번호, type: string }
                  - { name: newTab, label: 새 창, type: boolean }
              - { name: fontFamily, label: 폰트, type: string }
              - { name: fontSize, label: 글자 크기, type: number }
              - { name: fontWeight, label: 글자 굵기, type: number }
              - { name: lineHeight, label: 행간, type: number }
              - { name: letterSpacing, label: 자간, type: number }
              - name: textAlign
                type: select
                options:
                  values: [left, center, right]
              - { name: color, label: 글자색, type: string }
              - { name: background, label: 배경·그라디언트, type: string }
              - { name: borderColor, label: 선 색, type: string }
              - { name: borderWidth, label: 선 두께, type: number }
              - { name: borderRadius, label: 둥근 모서리, type: number }
              - { name: padding, label: 안쪽 여백, type: number }
              - name: objectFit
                type: select
                options:
                  values: [cover, contain, fill]
              - name: repeat
                type: select
                options:
                  values: [no-repeat, repeat, repeat-x, repeat-y]
              - { name: repeatSize, label: 반복 이미지 크기, type: number }
              - { name: loop, label: 반복, type: boolean }
              - { name: muted, label: 음소거, type: boolean }
              - { name: controls, label: 컨트롤, type: boolean }
              - { name: speed, label: 반복 글자 속도, type: number }
              - name: direction
                type: select
                options:
                  values: [left, right]
              - name: galleryItems
                label: 갤러리 이미지
                type: object
                list: true
                fields:
                  - { name: src, label: 이미지, type: image }
                  - { name: alt, label: 설명, type: string }
                  - { name: caption, label: 캡션, type: string }
              - name: galleryMode
                type: select
                options:
                  values: [grid, slideshow]
              - { name: galleryColumns, label: 갤러리 열, type: number }
              - { name: galleryGap, label: 갤러리 간격, type: number }
              - { name: galleryInterval, label: 슬라이드 시간, type: number }
              - { name: lightbox, label: 크게 보기, type: boolean }
              - { name: embedTitle, label: 임베드 제목, type: string }
              - name: navOrientation
                type: select
                options:
                  values: [horizontal, vertical]
              - { name: navGap, label: 메뉴 간격, type: number }
              - name: navMode
                label: 메뉴 구성
                type: select
                options:
                  values: [listed, custom]
              - { name: navPageIds, label: 직접 선택 페이지 ID, type: string, list: true }
              - name: navActiveStyle
                label: 현재 페이지 표시
                type: select
                options:
                  values: [underline, pill, fade, none]
              - { name: navShowIndex, label: 메뉴 번호 표시, type: boolean }
              - name: blendMode
                type: select
                options:
                  values: [normal, multiply, screen, overlay, difference, exclusion, color-burn, color-dodge]
              - { name: blur, type: number }
              - { name: grayscale, type: number }
              - { name: contrast, type: number }
              - { name: saturate, type: number }
              - { name: brightness, type: number }
              - { name: hueRotate, type: number }
              - { name: sepia, type: number }
              - { name: invert, type: number }
              - { name: focalX, type: number }
              - { name: focalY, type: number }
              - { name: videoStart, label: 영상 구간 시작(초), type: number }
              - { name: videoEnd, label: 영상 구간 끝(초), type: number }
              - { name: playbackRate, label: 재생 속도, type: number }
              - name: clipShape
                type: select
                options:
                  values: [none, circle, ellipse, triangle, diamond, hexagon, star, blob, blob2, arch, pill, custom]
              - { name: clipCustom, type: string }
              - name: hoverEffect
                type: select
                options:
                  values: [none, zoom, color, gray, bright, lift, swap]
              - { name: hoverSrc, type: string }
              - { name: shadowX, type: number }
              - { name: shadowY, type: number }
              - { name: shadowBlur, type: number }
              - { name: shadowColor, type: string }
              - { name: textEffect, label: 글자 효과, type: string }
              - { name: parallax, label: 스크롤 패럴랙스, type: number }
              - { name: mouseParallax, label: 마우스 패럴랙스, type: number }
              - { name: publicDraggable, label: 방문자 드래그, type: boolean }
              - { name: component, label: 컴포넌트 이름 (components/registry.js), type: string }
              - name: code
                label: 코드 블록
                type: object
                fields:
                  - { name: html, label: HTML, type: code }
                  - { name: css, label: CSS, type: code }
                  - { name: js, label: JavaScript, type: code }
              - { name: codeInteractive, label: 코드 블록 조작 허용, type: boolean }
              - { name: fixed, label: 화면에 고정, type: boolean }
              - name: fixedAnchor
                label: 고정 기준
                type: select
                options:
                  values: [top, bottom]
              - { name: pinEnabled, label: 스크롤 고정 (pin), type: boolean }
              - { name: pinTop, label: 고정 위치 (화면 위에서 px), type: number }
              - { name: pinDistance, label: 고정 거리 (px), type: number }
              - name: motion
                label: 애니메이션
                type: object
                fields:
                  - name: entrance
                    type: object
                    fields:
                      - { name: preset, type: string }
                      - { name: trigger, type: string }
                      - { name: duration, type: number }
                      - { name: delay, type: number }
                      - { name: easing, type: string }
                      - { name: once, type: boolean }
                  - name: hover
                    type: object
                    fields:
                      - { name: preset, type: string }
                      - { name: duration, type: number }
                      - { name: amount, type: number }
                  - name: loop
                    type: object
                    fields:
                      - { name: preset, type: string }
                      - { name: duration, type: number }
                      - { name: delay, type: number }
                      - { name: direction, type: string }
                  - name: timeline
                    label: Motion Lab 키프레임
                    type: object
                    fields:
                      - { name: enabled, label: 사용, type: boolean }
                      - name: trigger
                        label: 시작 조건
                        type: select
                        options:
                          values: [load, in-view, hover, press, click, scroll, linked]
                      - { name: duration, label: 시간(ms), type: number }
                      - { name: delay, label: 지연(ms), type: number }
                      - { name: iterations, label: 반복 횟수, type: number }
                      - { name: infinite, label: 무한 반복, type: boolean }
                      - name: direction
                        type: select
                        options:
                          values: [normal, reverse, alternate, alternate-reverse]
                      - name: fill
                        label: 완료 상태
                        type: select
                        options:
                          values: [none, forwards, backwards, both]
                      - name: origin
                        label: 변형 기준점
                        type: select
                        options:
                          values: [center, top, top-right, right, bottom-right, bottom, bottom-left, left, top-left]
                      - { name: perspective, label: 3D 원근, type: number }
                      - { name: once, label: 한 번만 재생, type: boolean }
                      - { name: linkTarget, label: 연결할 레이어 ID, type: string }
                      - name: linkEvent
                        label: 연결 이벤트
                        type: select
                        options:
                          values: [click, hover, press, in-view]
                      - name: linkMode
                        label: 연결 동작
                        type: select
                        options:
                          values: [toggle, restart]
                      - name: scrollRange
                        label: 스크롤 구간
                        type: select
                        options:
                          values: [element, enter, page]
                      - { name: scrubSmooth, label: 스크롤 따라오는 부드러움 (0–0.95), type: number }
                      - name: keyframes
                        label: 키프레임
                        type: object
                        list:
                          collapsible:
                            collapsed: true
                            summary: "{at}% · {id}"
                        fields:
                          - { name: id, type: string, required: true }
                          - { name: at, label: 위치(%), type: number }
                          - { name: x, label: X 이동, type: number }
                          - { name: y, label: Y 이동, type: number }
                          - { name: scaleX, label: 가로 배율, type: number }
                          - { name: scaleY, label: 세로 배율, type: number }
                          - { name: rotate, label: 회전 Z, type: number }
                          - { name: rotateX, label: 회전 X, type: number }
                          - { name: rotateY, label: 회전 Y, type: number }
                          - { name: skewX, label: 기울기 X, type: number }
                          - { name: skewY, label: 기울기 Y, type: number }
                          - { name: opacity, label: 투명도, type: number }
                          - { name: blur, label: 블러, type: number }
                          - { name: brightness, label: 밝기, type: number }
                          - { name: saturate, label: 채도, type: number }
                          - { name: hue, label: 색상 회전, type: number }
                          - { name: clipTop, label: 마스크 위 (%), type: number }
                          - { name: clipRight, label: 마스크 오른쪽 (%), type: number }
                          - { name: clipBottom, label: 마스크 아래 (%), type: number }
                          - { name: clipLeft, label: 마스크 왼쪽 (%), type: number }
                          - { name: easing, label: 이징, type: string }

  - name: notes
    label: Research axes
    type: file
    path: content/notes.json
    format: json
    list: true
    fields:
      - { name: number, type: string }
      - { name: title, type: string }
      - { name: text, type: text }

settings:
  content:
    merge: true
